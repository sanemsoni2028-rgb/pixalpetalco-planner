:root{--serif:"Newsreader",Georgia,"Times New Roman",serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--hand:"Caveat","Segoe Script",cursive;
  --bg:#FBF8F1;--card:#fff;--line:#E7E0D1;--ink:#24302A;--muted:#6B766F;--faint:#8F8B7B;--track:#EDE6D6;--hair:#F1EBDD;--cbline:#BDB7A2;
  --accent:#2D4636;--accent-ink:#fff;--accent2:#8FA58A;--gold:#B08D57;--gold-d:#8A6425;--clay:#B9694A;--clay-l:#F3DDD0;--sage-l:#DCE6D6;--gold-l:#EBDDBB;--shadow:rgba(40,50,35,.08);
  --side:#F3ECDD;--side-line:#E7DECB;--side-ink:#24302A;--side-muted:#8D8777;--nav:#5F6A63;--nav-on-bg:#fff;--nav-on-ink:#24302A;--logo-bg:#2D4636;--logo-ink:#F3EBDD;--logo-gold:#E9C98F;--logo-em:#8A6425;
  --heat0:#EDE8DA;--heat1:#CFDBC8;--heat2:#A5BD9E;--heat3:#6A8D70;--heat4:#2D4636;color-scheme:light}
[data-theme=forest]{--side:#2A4535;--side-line:#2A4535;--side-ink:#F6EEDC;--side-muted:#86A08C;--nav:#CBD6C8;--nav-on-bg:#F3EBDD;--nav-on-ink:#1F3127;--logo-bg:#F3EBDD;--logo-ink:#2A4535;--logo-gold:#B08D57;--logo-em:#E9C98F}
[data-theme=dark]{--bg:#161F1A;--card:#1F2A24;--line:#2D3B33;--ink:#EEE8D9;--muted:#A0ADA4;--faint:#74827A;--track:#2D3B33;--hair:#27342C;--cbline:#52645A;--accent:#86AE90;--accent-ink:#10201A;--accent2:#53705C;--gold:#D4B677;--gold-d:#D9BE87;--clay:#E0A488;--clay-l:#4A3328;--sage-l:#2B4333;--gold-l:#463B24;--shadow:rgba(0,0,0,.3);
  --side:#111815;--side-line:#25322B;--side-ink:#EEE8D9;--side-muted:#6F7E75;--nav:#A9B6AC;--nav-on-bg:#27342C;--nav-on-ink:#EEE8D9;--logo-bg:#86AE90;--logo-ink:#10201A;--logo-gold:#10201A;--logo-em:#D9BE87;
  --heat0:#27342C;--heat1:#2F4A3A;--heat2:#46704F;--heat3:#6A9A74;--heat4:#9BC4A4;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font:400 15px/1.45 var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px;border-radius:8px}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ───── shell ───── */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);border-right:1px solid var(--side-line);padding:22px 16px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:auto}
.logo{display:flex;align-items:center;gap:11px;padding:2px 8px 22px;font:600 21px/1 var(--serif);letter-spacing:-.01em;white-space:nowrap;text-decoration:none;color:inherit}
.logo .lm{width:34px;height:34px;border-radius:10px;background:var(--logo-bg);color:var(--logo-ink);--pp-gold:var(--logo-gold);display:grid;place-items:center;flex:none}
.logo .lm svg{width:21px;height:21px}
.logo em{font-style:italic;font-weight:500;color:var(--logo-em)}
.navlabel{font:600 10.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--side-muted);padding:12px 12px 8px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;font-weight:500;color:var(--nav);margin-bottom:3px;text-decoration:none;cursor:pointer}
.nav a .ic{font-size:19px}
.nav a.on{background:var(--nav-on-bg);color:var(--nav-on-ink);box-shadow:0 1px 4px var(--shadow)}
.nav a:hover:not(.on){background:rgba(127,127,127,.09)}
.safe{margin-top:auto;display:flex;gap:11px;align-items:center;padding:12px;border-radius:12px;background:rgba(127,127,127,.09);color:var(--side-ink);font-size:12px;line-height:1.35}
.safe .ic{font-size:19px;color:var(--gold)}
.safe b{display:block;font-size:12.5px}.safe small{color:var(--side-muted);font-size:11.5px}
.main{min-width:0;padding:22px 34px 70px;max-width:1260px;width:100%;margin:0 auto}
.top{display:flex;gap:12px;align-items:center;margin-bottom:20px}
.search{flex:1;height:42px;border-radius:13px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--faint)}
.search input{flex:1;border:0;outline:0;background:transparent;min-width:0;color:var(--ink)}
.search input::placeholder{color:var(--faint)}
.btn{height:42px;padding:0 18px;border-radius:13px;background:var(--accent);color:var(--accent-ink);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{height:34px;padding:0 14px;font-size:13px;border-radius:10px}
.btn.danger{background:transparent;color:var(--clay);border:1.5px solid var(--clay-l)}
.tabbar{display:none}
/* ───── type & cards ───── */
.eyebrow{font:600 11.5px var(--sans);letter-spacing:.16em;color:var(--clay);text-transform:uppercase}
h1{font:600 34px/1.15 var(--serif);margin:5px 0 4px;letter-spacing:-.012em}
h2{font:600 22px/1.2 var(--serif)}
.sub{color:var(--muted);font-size:14.5px}
.head{margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;box-shadow:0 1px 2px var(--shadow)}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.ch b{font-size:15px}.mut{color:var(--faint);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat small{display:block;font:600 10px var(--sans);letter-spacing:.13em;color:var(--faint);text-transform:uppercase}
.stat b{display:block;font:500 30px/1.1 var(--serif);margin-top:4px}
.pill{font:600 11px var(--sans);padding:3px 10px;border-radius:99px;font-style:normal;white-space:nowrap}
.p-work{background:var(--sage-l);color:#34553F}.p-personal{background:var(--clay-l);color:#97502F}.p-home{background:var(--gold-l);color:#7D5E27}
[data-theme=dark] .p-work{color:#BFDCC6}[data-theme=dark] .p-personal{color:#EBBFA6}[data-theme=dark] .p-home{color:#E5CD93}
.row{display:flex;align-items:center;gap:13px;padding:10px 0;border-top:1px solid var(--hair)}
.row.first,.card>.row:first-of-type{border-top:0}
.row .t{flex:1;font-weight:500;text-align:left;min-width:0;overflow-wrap:anywhere}
.row.done .t{color:var(--faint);text-decoration:line-through}
.due{font-size:12.5px;color:var(--muted);min-width:62px;text-align:right}.due.late{color:var(--clay);font-weight:600}
.cb{width:22px;height:22px;border-radius:7px;border:1.8px solid var(--cbline);flex:none;position:relative;display:inline-block;background:var(--card);transition:background .15s,border-color .15s}
.cb:hover{border-color:var(--accent)}
.cb.on{background:var(--accent);border-color:var(--accent)}
.cb.on::after{content:"";position:absolute;left:6.4px;top:2.3px;width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.2px 2.2px 0;transform:rotate(45deg)}
.prio{display:flex;align-items:center;gap:13px;padding:11px 0;border-top:1px solid var(--hair)}
.prio:first-of-type{border-top:0}
.prio i{font:italic 500 18px var(--serif);color:var(--clay);width:26px;font-style:italic}
.prio.done .t{color:var(--faint);text-decoration:line-through}
.prio .t{flex:1;font-weight:500;text-align:left}
.pinbtn{color:var(--faint);font-size:18px;padding:4px}.pinbtn.on{color:var(--gold)}
.bar{height:8px;border-radius:8px;background:var(--track);overflow:hidden}.bar i{display:block;height:100%;border-radius:8px;background:var(--accent);transition:width .35s}
.bar.clay i{background:var(--clay)}
.pmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;margin-top:7px;gap:10px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:7px 15px;border-radius:99px;font:600 13px var(--sans);color:var(--muted);background:var(--card);border:1px solid var(--line)}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ring{--p:0;width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--track) 0);display:grid;place-items:center;flex:none}
.ring span{width:calc(100% - 20px);height:calc(100% - 20px);border-radius:50%;background:var(--card);display:grid;place-items:center;font:500 24px var(--serif)}
.ring.clay{background:conic-gradient(var(--clay) calc(var(--p)*1%),var(--track) 0)}
.grpl{font:600 11px var(--sans);letter-spacing:.14em;color:var(--faint);text-transform:uppercase;padding:14px 0 4px}
.empty{padding:22px 8px;text-align:center;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font:600 12px var(--sans);letter-spacing:.04em;color:var(--muted)}
.inp{height:42px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);padding:0 12px;width:100%;outline:0}
textarea.inp{height:auto;min-height:92px;padding:10px 12px;resize:vertical;line-height:1.5}
.inp:focus{border-color:var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);font:600 13px var(--sans);color:var(--muted);background:var(--card)}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.flex{display:flex;align-items:center;gap:12px}.sp{flex:1}
.link{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
[data-theme=dark] .link{color:var(--accent)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--gold-l);color:#6b4f1d;border-radius:14px;padding:11px 16px;margin-bottom:16px;font-size:13.5px}
[data-theme=dark] .banner{color:#E5CD93}
/* habits */
.hrow{display:grid;grid-template-columns:minmax(120px,1.4fr) auto 1fr;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--hair)}
.hrow:first-of-type{border-top:0}
.hname{font-weight:500;overflow-wrap:anywhere}
.hstreak{font-size:12.5px;color:var(--clay);font-weight:600;display:flex;gap:4px;align-items:center;white-space:nowrap}
.hdays{display:flex;gap:6px;justify-content:flex-end}
.hd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--faint)}
.dot{width:28px;height:28px;border-radius:50%;border:1.8px solid var(--cbline);display:grid;place-items:center;background:var(--card);color:transparent;transition:.15s}
.dot.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dot.today{box-shadow:0 0 0 3px var(--sage-l)}
.dot .ic{font-size:14px;stroke-width:2.6}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat i{aspect-ratio:1;border-radius:7px;display:block}
.hlbl{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:10.5px;color:var(--faint);text-align:center;margin-bottom:6px}
/* projects & goals */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.pcard{display:flex;flex-direction:column;gap:10px}
.pcard h3{font:600 20px/1.2 var(--serif)}
.pnext{color:var(--muted);font-size:13.5px}.pnext b{color:var(--ink);font-weight:600}
.add-card{border:2px dashed var(--line);border-radius:16px;display:grid;place-items:center;min-height:170px;color:var(--faint);font-weight:600;gap:6px;text-align:center;padding:20px}
.add-card:hover{border-color:var(--accent);color:var(--accent)}
.ms{display:flex;align-items:center;gap:11px;padding:8px 0;border-top:1px solid var(--hair);text-align:left;width:100%}
.ms.done span{color:var(--faint);text-decoration:line-through}
/* challenges */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:8px}
.day{height:40px;border-radius:11px;border:1.5px solid var(--line);display:grid;place-items:center;font:600 12.5px var(--sans);color:var(--faint);background:var(--card)}
.day.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day.today{border-color:var(--clay);color:var(--clay);box-shadow:0 0 0 3px var(--clay-l)}
.day.done.today{color:var(--accent-ink)}
.day.ms7{position:relative}.day.ms7::after{content:"";position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;background:var(--gold);border:2px solid var(--card)}
.chal{display:flex;flex-direction:column;gap:8px}
.chal h3{font:600 19px var(--serif)}
.badge{display:inline-flex;align-items:center;gap:6px;font:600 11.5px var(--sans);padding:4px 10px;border-radius:99px;background:var(--gold-l);color:#7D5E27;width:fit-content}
[data-theme=dark] .badge{color:#E5CD93}
/* stickers */
.stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.stk{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:18px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.stk .art{width:84px;height:84px;display:grid;place-items:center}
.stk.locked .art{filter:grayscale(1);opacity:.38}
.stk b{font-size:14px}.stk small{color:var(--muted);font-size:12px;line-height:1.35}
.stk .when{font-size:11px;color:var(--gold-d);font-weight:600}
/* modal, toast, fx */
.mback{position:fixed;inset:0;background:rgba(20,30,24,.48);display:grid;place-items:center;padding:18px;z-index:50;animation:fade .18s}
.modal{background:var(--card);border-radius:22px;padding:26px 26px 22px;width:min(520px,100%);max-height:calc(100vh - 36px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:rise .22s}
.modal h2{margin-bottom:4px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.celebrate{text-align:center;padding-top:6px}
.celebrate .art{display:flex;justify-content:center;margin:2px 0 6px}
.celebrate h2{font-size:28px;margin:8px 0 6px}
.celebrate p{color:var(--muted)}
#toast-root{position:fixed;left:0;right:0;bottom:22px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:70;pointer-events:none}
.toast{pointer-events:auto;background:#1E2B24;color:#F3EBDD;border-radius:14px;padding:11px 16px;font-size:13.5px;box-shadow:0 12px 30px rgba(0,0,0,.28);display:flex;gap:12px;align-items:center;animation:rise .22s;max-width:min(92vw,460px)}
.toast .link{color:#E9C98F}
#fx-root{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.fxpop{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;animation:pop .62s ease-out forwards}
@keyframes pop{0%{transform:scale(.35);opacity:0}25%{opacity:1}100%{transform:scale(1.25);opacity:0}}
@keyframes fade{from{opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
.cb.bounce{animation:bounce .3s}
@keyframes bounce{40%{transform:scale(1.18)}}
.thanks{max-width:640px;margin:10px auto}
.note{background:linear-gradient(170deg,#FFFDF7,#F6EFE1);border:1px solid #E7DCC2;border-radius:6px;padding:44px 44px 34px;box-shadow:0 22px 50px rgba(60,45,20,.16);color:#1F3127;position:relative}
[data-theme=dark] .note{box-shadow:0 22px 50px rgba(0,0,0,.4)}
.note .sprig{width:42px;color:#B08D57}
.note h2{font:400 54px/1 var(--serif);letter-spacing:-.02em;margin-top:14px;color:#1F3127}
.note h2 em{display:block;color:#2F4A3B;font-size:50px}
.note .gr{width:64px;height:2px;background:#B08D57;margin:20px 0}
.note p{font:400 19px/1.65 var(--serif);color:#34433a;margin-bottom:12px}
.sign{font:700 40px/1 var(--hand);color:#2D4636;margin-top:18px}
.role{font:600 12px var(--sans);letter-spacing:.2em;color:#5a665e;margin-top:6px;text-transform:uppercase}
/* ───── responsive ───── */
@media (max-width:900px){
  .app{grid-template-columns:78px minmax(0,1fr)}
  .side{padding:18px 10px}.logo{justify-content:center;padding-left:0;padding-right:0}.logo>span:last-child,.nav a span,.navlabel,.safe div{display:none}
  .nav a{justify-content:center;padding:12px 0}.nav a .ic{font-size:22px}.safe{justify-content:center}
  .main{padding:20px 22px 70px}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:700px){
  .app{display:block}.side{display:none}
  .main{padding:14px 14px 104px}
  h1{font-size:28px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:40;justify-content:space-around}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font:600 10.5px var(--sans);color:var(--faint);min-width:56px;padding:4px 6px;text-decoration:none;cursor:pointer}
  .tabbar a .ic{font-size:23px}.tabbar a.on{color:var(--accent)}
  .stats{grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:10px}.stat b{font-size:25px}
  .row{gap:10px}.due{min-width:0;font-size:12px}.row .pill{display:none}
  .hrow{grid-template-columns:1fr auto;grid-template-areas:"n s" "d d"}.hname{grid-area:n}.hstreak{grid-area:s}.hdays{grid-area:d;justify-content:space-between}
  .dot{width:32px;height:32px}
  .note{padding:30px 24px 26px}.note h2{font-size:42px}.note h2 em{font-size:38px}
  .two{grid-template-columns:1fr}
  .top .btn .lbl{display:none}.top .btn{padding:0 14px}
  .modal{padding:22px 18px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media print{.side,.tabbar,.top,#toast-root{display:none!important}.app{display:block}}

<script>
(()=>{'use strict';

/* ───── dates ───── */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const weekStart=s=>{const d=parse(s);const k=(d.getDay()-S.settings.weekStart+7)%7;d.setDate(d.getDate()-k);return iso(d)};

let S,storageOK=true;

/* ───── sample data (relative to today, so it always feels current) ───── */
const AREA={work:'Work',home:'Home',personal:'Personal'};
function seed(name){
  const t=today(),d=n=>addDays(t,n),mk=(title,area,due,x={})=>({id:uid(),title,area,due,time:'',pin:0,pri:null,done:false,doneOn:null,...x});
  const tasks=[

    mk('Prepare Monday team agenda','work',d(3),{pri:'med'}),

    goals:[{id:uid(),title:'Run a 10K',due:d(90),ms:[{t:'Run 2 km without stopping',done:true},{t:'Run 5 km',done:true},{t:'Run 8 km',done:false},{t:'Run the 10K',done:false}]},{id:uid(),title:'Save for a holiday',due:d(150),ms:[{t:'Open a savings jar',done:true},{t:'Reach 25%',done:true},{t:'Reach 50%',done:false},{t:'Reach 100%',done:false}]},{id:uid(),title:'Read 12 books this year',due:d(240),ms:[{t:'3 books',done:true},{t:'6 books',done:false},{t:'9 books',done:false},{t:'12 books',done:false}]}],
    challenge:ch,doneChallenges:[],

    reviews:{}};
}
function fresh(keep){const s=seed('');s.tasks=[];s.habits=[];s.projects=[];s.goals=[];s.challenge=null;s.stickers={};s.reviews={};s.settings={...s.settings,...(keep||{}),sample:false};return s}
/* ───── definitions ───── */
const CHALLENGES=[

/* ───── art ───── */
let _m=0;
function medal(d,num,label){const id='mg'+(++_m),r=d/2,H=d*1.5;let reed='';for(let i=0;i<84;i++){const a=i/84*6.2832,c=Math.cos(a),s=Math.sin(a);reed+=`<line x1="${(r+c*r*.925).toFixed(1)}" y1="${(r+s*r*.925).toFixed(1)}" x2="${(r+c*r*.99).toFixed(1)}" y2="${(r+s*r*.99).toFixed(1)}" stroke="#6E501F" stroke-opacity=".5" stroke-width="${(d*.007).toFixed(2)}"/>`}
 return `<svg width="${d}" height="${H}" viewBox="0 0 ${d} ${H}" style="overflow:visible;filter:drop-shadow(0 ${d*.05}px ${d*.07}px rgba(30,20,5,.32))" aria-hidden="true"><defs><linearGradient id="${id}a" x1=".1" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#F6E7B8"/><stop offset=".42" stop-color="#CFA85F"/><stop offset="1" stop-color="#85622A"/></linearGradient><linearGradient id="${id}b" x1=".9" y1="0" x2=".1" y2="1"><stop offset="0" stop-color="#FBF0CC"/><stop offset=".5" stop-color="#D8B56F"/><stop offset="1" stop-color="#9C7632"/></linearGradient><radialGradient id="${id}c" cx=".35" cy=".28" r=".95"><stop offset="0" stop-color="#FFFEF8"/><stop offset=".7" stop-color="#F1E7CF"/><stop offset="1" stop-color="#E1D0A9"/></radialGradient></defs>

 <circle cx="${r}" cy="${r}" r="${r}" fill="url(#${id}a)"/>${reed}<circle cx="${r}" cy="${r}" r="${r*.88}" fill="url(#${id}b)"/><circle cx="${r}" cy="${r}" r="${r*.78}" fill="url(#${id}c)" stroke="#A07A36" stroke-width="${d*.008}"/><circle cx="${r}" cy="${r}" r="${r*.69}" fill="none" stroke="#B08D57" stroke-width="${d*.007}" stroke-dasharray="${d*.006} ${d*.02}" stroke-linecap="round"/>
